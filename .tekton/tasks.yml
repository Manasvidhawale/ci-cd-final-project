apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Cleans up existing workspace before clone
  workspaces:
    - name: source
  steps:
    - name: clean
      image: alpine:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "Cleaning up workspace directory..."
        rm -rf * .* 2>/dev/null || true
        echo "Workspace cleaned successfully."
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Runs unit tests with nose test runner
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        pip install --upgrade pip
        pip install -r requirements.txt
        nosetests -v --with-spec --spec-color

